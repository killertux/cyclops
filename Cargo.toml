[workspace]
resolver = "3"
members = ["crates/*", "fixtures"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
cyclops-application = { path = "crates/cyclops-application" }
cyclops-cli = { path = "crates/cyclops-cli" }
cyclops-domain = { path = "crates/cyclops-domain" }
cyclops-infra = { path = "crates/cyclops-infra" }
cyclops-lang-gleam = { path = "crates/cyclops-lang-gleam" }
cyclops-lang-rust = { path = "crates/cyclops-lang-rust" }
cyclops-lang-typescript = { path = "crates/cyclops-lang-typescript" }
cyclops-semantic = { path = "crates/cyclops-semantic" }
cyclops-tui = { path = "crates/cyclops-tui" }

anyhow = "1"
# Only to copy with `yy`: some terminals block the escape codes for it.
arboard = { version = "3", default-features = false }
blake3 = "1"
# Only reading history: no network, no worktree changes.
gix = { version = "0.90", default-features = false, features = ["blob-diff", "revision", "sha1"] }
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
# Only to say `stale` when files change.
notify = "8"
# The oxc_* crates break their APIs often, so they are pinned on purpose, all to one version.
oxc_allocator = "=0.157.0"
oxc_ast = "=0.157.0"
oxc_ast_visit = "=0.157.0"
oxc_parser = "=0.157.0"
oxc_span = "=0.157.0"
oxc_syntax = "=0.157.0"
# The ra_ap_* crates break their APIs often, so this is pinned on purpose. It also pins
# unicode-ident, so Cargo.lock keeps unicode-properties on the same Unicode version.
ra_ap_syntax = "=0.0.360"
petgraph = "0.8"
postcard = { version = "1", features = ["use-std"] }
# Only to decode SCIP: `scip` does not re-export it. Pinned to the version `scip` pins.
protobuf = "=3.7.2"
ratatui = "0.30"
rayon = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
scip = "0.10"
serde = { version = "1", features = ["derive"] }
terminal-colorsaurus = "1"
thiserror = "2"
# Each grammar is generated for a tree-sitter version, so the family is pinned and upgraded
# together. The grammars compile C code, so building needs a C compiler.
tree-sitter = "=0.27.2"
tree-sitter-gleam = "=1.0.0"
toml = "1"
toml_edit = "0.25"

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
# Lint groups. Priority -1 lets the individual lints below override them.
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Code must not panic: return a Result or Option instead.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
string_slice = "deny"

# Errors must not be silently dropped.
let_underscore_must_use = "deny"
unused_result_ok = "deny"

# Cleanup must run: these skip destructors.
exit = "deny"
mem_forget = "deny"

# Debug leftovers.
dbg_macro = "deny"

# Lint overrides must use #[expect] and state a reason.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

# If unsafe is ever approved, each block needs a SAFETY comment.
undocumented_unsafe_blocks = "deny"
