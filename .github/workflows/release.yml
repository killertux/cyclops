# Builds the `cyclops` binary for each platform when a version tag is pushed, and
# publishes them as a GitHub release. `install.sh` downloads from these releases.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_RELEASE_STRIP: "true"

jobs:
  check-version:
    name: Check the tag matches the version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare the tag with the workspace version
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version *= *"\(.*\)"/\1/p' Cargo.toml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag $GITHUB_REF_NAME does not match the workspace version $version. Bump [workspace.package] version in Cargo.toml, or tag v$version."
            exit 1
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: check-version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The newest image, since GitHub retires old ones. Rust still targets macOS 11.
          - target: aarch64-apple-darwin
            runner: macos-latest
          # Built on the oldest supported Ubuntu, so the binaries need only glibc 2.35.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable
      - name: Build
        run: cargo build --release --locked --package cyclops-cli --target ${{ matrix.target }}
      - name: Package
        run: |
          name=cyclops-${{ matrix.target }}
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/cyclops" "$name/"
          cp README.md "$name/"
          tar -czf "$name.tar.gz" "$name"
          if command -v sha256sum >/dev/null; then
            sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          else
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: cyclops-${{ matrix.target }}
          path: |
            cyclops-${{ matrix.target }}.tar.gz
            cyclops-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error

  release:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Cyclops $GITHUB_REF_NAME" \
            --generate-notes
